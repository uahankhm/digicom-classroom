<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 프롬프트 만들기</title><style>
:root{font-family:'Malgun Gothic',Pretendard,system-ui,sans-serif;color:#253047;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#263d67,#3a8a88);color:white;padding:36px max(18px,calc((100vw - 1120px)/2))}h1{margin:0 0 9px;font-size:clamp(27px,4vw,39px)}header p{line-height:1.6;margin:0;max-width:780px}.wrap{max-width:1120px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:20px}.card{background:white;border:1px solid #dae4e7;border-radius:18px;padding:22px;box-shadow:0 7px 22px #1d4b5610}.editor{display:grid;gap:20px}h2{font-size:19px;margin:0 0 12px}.intro{font-size:13px;color:#576576;line-height:1.6;margin:0 0 12px}.modegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode{border:1px solid #cbdde0;background:#fff;text-align:left;padding:13px;border-radius:12px;cursor:pointer;color:#253047;font:inherit}.mode strong{display:block;font-size:15px}.mode small{display:block;color:#647381;line-height:1.5;margin-top:5px}.mode.active{border:2px solid #248982;background:#eef9f6;padding:12px}.field{margin:16px 0}.field strong{display:block;margin-bottom:8px;font-size:14px}.field .desc{font-size:12px;color:#61717e;line-height:1.55;margin:0 0 8px}input[type=text],textarea,select{width:100%;border:1px solid #cbd8de;border-radius:9px;padding:10px 11px;font:inherit;color:#243248;background:#fff}textarea{min-height:86px;resize:vertical;line-height:1.55}.choice{display:flex;flex-wrap:wrap;gap:7px}.choice label{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid #d4e0e3;border-radius:22px;font-size:13px;cursor:pointer}.choice label:has(input:checked){border-color:#23887e;background:#e8f7f3;color:#136960}input[type=checkbox],input[type=radio]{accent-color:#19877b}.guide{white-space:pre-line;background:#f1f8f7;border-left:3px solid #56aaa2;border-radius:7px;color:#4e6265;font-size:12px;line-height:1.65;padding:9px 11px;margin:9px 0 0}.output{position:sticky;top:18px;align-self:start}.output textarea{min-height:520px;font-size:13px;line-height:1.65}.actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}button.primary{border:0;border-radius:9px;background:#237e78;color:white;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}button.light{border:0;border-radius:9px;background:#e8f1f1;color:#265859;padding:12px 16px;font:inherit;cursor:pointer}.tip{background:#fff7e7;border-radius:9px;padding:11px;font-size:12px;line-height:1.6;margin-top:15px;color:#68583d}#status{font-size:13px;color:#1d796f;min-height:20px;margin-top:7px}@media(max-width:820px){.wrap{grid-template-columns:1fr}.output{position:static}.modegrid{grid-template-columns:1fr 1fr}.output textarea{min-height:370px}}@media(max-width:460px){.modegrid{grid-template-columns:1fr}}
</style></head><body><header><h1>이미지 프롬프트 만들기</h1><p>먼저 어떤 이미지를 만들지 고르세요. 필요한 선택지만 차례로 나타나고, 오른쪽에 요청문이 완성됩니다.</p></header><main class="wrap"><section class="card editor"><div><h2>1. 만들 이미지 유형</h2><div class="modegrid" id="modes"></div></div><div id="fields"></div></section><section class="card output"><h2>완성된 요청문</h2><p class="intro">사진을 바꾸는 유형은 원본 사진도 함께 첨부하세요. 정보형 이미지는 정확한 내용을 입력할수록 결과가 좋아집니다.</p><textarea id="result" readonly aria-label="완성된 요청문"></textarea><div class="actions"><button type="button" class="primary" id="copy">전체 복사하기</button><button type="button" class="light" id="reset">현재 유형 초기화</button></div><div id="status" role="status" aria-live="polite"></div><div class="tip" id="tip"></div></section></main><script>
const modes={
photo:{title:'사진을 그림으로',summary:'원본 사진의 인물과 배경을 화풍만 바꾸기',intro:'원본 사진을 첨부하세요. 유지할 요소를 먼저 결정합니다.',fields:[
{id:'keep',label:'원본에서 지킬 것',kind:'multi',options:[['얼굴·표정','같은 사람임을 알아볼 수 있도록'],['구도·카메라 각도','촬영 위치와 화면 구성을 유지'],['포즈·시선','몸짓과 바라보는 방향을 유지'],['헤어·의상','옷과 머리 모양을 유지'],['배경·소품·인원수','장소와 사물, 사람 수를 유지'],['시간대·조명','낮·밤과 실제 광원을 유지']],defaults:[0,1,2,3,4,5]},
{id:'identity',label:'인물 동일성',kind:'one',options:[['얼굴을 최대한 동일하게','눈·코·입의 형태, 얼굴형, 나이, 피부톤과 고유 특징 유지'],['얼굴 특징을 유지하며 약하게 스타일화','표현 재료에 맞춰 선과 색만 바꾸기'],['인물이 없는 사진','얼굴 관련 지시 생략']],default:0},
{id:'style',label:'그림 표현',kind:'one',options:[['극장판 2D 애니메이션','섬세한 선화와 셀 채색'],['수채화','물감 번짐과 투명한 색'],['색연필','종이결과 색연필 획'],['한국 수묵담채화','먹선과 은은한 채색'],['따뜻한 구아슈','불투명한 붓질과 포근한 색'],['연필 소묘','흑백 명암과 손그림 선']],default:0},
{id:'tone',label:'분위기',kind:'one',options:[['원본 분위기 유지','가장 안전한 선택'],['따뜻하고 다정하게','가족·일상 사진'],['청량하고 밝게','야외·여행 사진'],['차분하고 서정적으로','추억·인물 사진']],default:0},
{id:'extra',label:'절제해서 더할 효과',kind:'multi',options:[['부드러운 반사광','빛이 표면에 닿은 느낌'],['은은한 림라이트','가장자리에 얇은 빛'],['공기 원근감','먼 배경에 자연스러운 거리감'],['미세한 먼지 입자','햇빛이 있는 사진에 적합']],defaults:[]}]},
edit:{title:'원본 사진 수정',summary:'얼굴은 유지하고 옷·배경·소품 등 선택해서 바꾸기',intro:'원본 사진을 첨부하고, 바꿀 부분과 지킬 부분을 구체적으로 적으세요.',fields:[
{id:'editwhat',label:'바꾸고 싶은 부분',kind:'long',placeholder:'예: 옷만 파스텔 한복으로 변경 / 배경을 밝은 정원으로 변경'},
{id:'editkeep',label:'그대로 둘 부분',kind:'multi',options:[['인물의 얼굴·나이·피부톤','인물 동일성 최우선'],['표정·시선·포즈','몸짓과 감정 유지'],['헤어스타일','머리 길이·모양 유지'],['카메라 각도·구도','크롭과 인물 크기 유지'],['조명·그림자','원본의 빛 방향 유지'],['나머지 배경·소품','지정한 부분 이외 유지']],defaults:[0,1,2,3,4,5]},
{id:'editstrength',label:'변경 범위',kind:'one',options:[['지정한 부분만 최소한으로','원본 보존에 유리'],['지정한 부분을 자연스럽게 바꾸기','이음새와 조명 조정 허용'],['장면 분위기도 함께 바꾸기','조명과 색감도 재해석']],default:0},
{id:'editnotes',label:'인물의 고유 특징·주의 사항',kind:'long',placeholder:'예: 왼쪽 눈가 점 유지, 미소와 앞머리 유지, 인원수 변경 금지'}]},
doodle:{title:'사진에 손그림 추가',summary:'흰 펜 윤곽선, 화살표, 짧은 메모',intro:'원본 사진 위에 드로잉을 얹습니다. 사진 자체는 바꾸지 않도록 요청합니다.',fields:[
{id:'color',label:'펜 색과 선',kind:'one',options:[['얇은 흰색 펜','어두운 사진에 잘 보임'],['얇은 검은색 펜','밝은 사진에 잘 보임'],['크림색 손그림 선','부드럽고 따뜻한 느낌'],['두 가지 색만 사용','사진의 주요 색과 조화']],default:0},
{id:'marks',label:'표시할 요소',kind:'multi',options:[['사물 윤곽','주요 사물의 바깥선을 따라'],['화살표·점선','시선을 안내'],['작은 반짝임·하트','여백에만 소량'],['짧은 손글씨','한두 문장 이내'],['여백 유지','사진의 중심은 가리지 않기'],['동그라미·밑줄','중요한 곳만 표시'],['작은 낙서 아이콘','구름·별·음표 등 작은 그림'],['손그림 테두리','사진 가장자리의 일부만']],defaults:[0,1,3,4]},
{id:'targets',label:'특별히 표시할 대상·위치 (선택)',kind:'long',placeholder:'한 줄에 하나씩 적으세요. 예: 왼쪽 컵 → 얇은 화살표와 작은 하트\n인물 옆 꽃 → 흰색 윤곽선과 속마음'},
{id:'title',label:'큰 제목 · 내가 쓴 말 (선택)',kind:'text',placeholder:'예: 오늘의 작은 행복 · 비워두면 제목 없음'},
{id:'thoughtmode',label:'화살표 옆 작은 속마음',kind:'one',options:[['사진을 보고 자동으로 쓰기','화살표가 가리키는 장면에서 느껴지는 말 1~2개'],['내가 직접 쓰기','아래 입력한 속마음만 사용'],['속마음 없이','화살표와 선만 사용']],default:0},
{id:'voice',label:'속마음의 말투',kind:'one',options:[['다정하고 편안하게','예: 오늘도 참 좋다'],['장난스럽고 귀엽게','예: 이 순간, 찜!'],['담백한 일기처럼','예: 잠깐 쉬어가는 중'],['감탄하는 느낌','예: 아, 좋다!']],default:0},
{id:'thought',label:'직접 쓸 작은 속마음 (선택)',kind:'text',placeholder:'예: 여기 바람이 참 좋다 · 입력하면 자동 설정보다 우선합니다'},
{id:'density',label:'장식의 양',kind:'one',options:[['아주 적게','사진이 주인공'],['적당히','포인트 몇 군데'],['조금 풍성하게','복잡한 사진은 피하기']],default:0}]},
scene:{title:'새로운 장면 만들기',summary:'참고 인물·장소·행동·빛·화풍을 조합',intro:'처음 만드는 인물인지, 참고 사진의 인물인지부터 선택하세요. 참고 인물이 있다면 사진을 함께 첨부합니다.',fields:[
{id:'reference',label:'인물 기준',kind:'one',options:[['새 인물을 만들기','아래에 외모를 구체적으로 적기'],['첨부 사진 속 같은 인물','얼굴·나이·피부톤·고유 특징을 유지하고 새 장면에 등장'],['인물 없이 풍경·사물만','인물 관련 지시 생략']],default:0},
{id:'who',label:'주인공·외모',kind:'long',placeholder:'예: 성인 여성 한 명, 짧은 곱슬머리, 둥근 안경 / 참고 사진을 쓴다면 바꿀 옷만 적기'},
{id:'where',label:'장소와 배경',kind:'text',placeholder:'예: 비 온 뒤의 조용한 골목'},
{id:'action',label:'행동과 장면',kind:'text',placeholder:'예: 작은 가게 앞에서 우산을 접고 있다'},
{id:'expression',label:'표정과 시선',kind:'text',placeholder:'예: 작게 미소 짓고 길 끝을 바라본다'},
{id:'wardrobe',label:'의상·소품',kind:'text',placeholder:'예: 파란 우비와 투명 우산'},
{id:'time',label:'시간과 날씨',kind:'one',options:[['밝은 낮','자연스러운 햇빛'],['아침','부드러운 사선 빛'],['해질 무렵','따뜻한 노을빛'],['밤','가로등과 어두운 하늘'],['흐린 날','부드러운 확산광'],['비 오는 날','젖은 표면과 반사']],default:0},
{id:'view',label:'카메라 구도',kind:'one',options:[['눈높이·중간 거리','인물과 주변을 함께'],['넓은 전경','장소를 크게 보여줌'],['가까운 인물 중심','표정과 손동작 강조'],['위에서 내려다보기','배치를 한눈에'],['낮은 시점','인물이 크게 보임'],['뒷모습·어깨 너머','인물이 바라보는 풍경 강조']],default:0},
{id:'art',label:'표현 방식',kind:'one',options:[['사진처럼 사실적','실제 촬영한 듯한 질감'],['2D 애니메이션','선화와 셀 채색'],['수채화 삽화','부드러운 번짐'],['한국 수묵담채화','먹선과 절제된 색'],['구아슈','불투명한 붓질'],['색연필','종이와 색연필의 결'],['종이 콜라주','오려 붙인 재료감'],['점토·클레이아트','손으로 빚은 입체 질감']],default:0},
{id:'scenemood',label:'감정과 색감',kind:'one',options:[['자연스럽고 담백하게','과장하지 않은 일상'],['따뜻하고 포근하게','베이지·금빛 계열'],['맑고 청량하게','푸른빛·선명한 공기'],['차분하고 서정적으로','절제된 대비와 여백'],['활기차고 경쾌하게','밝은 색과 역동감']],default:0},
{id:'sceneavoid',label:'빼고 싶은 요소',kind:'text',placeholder:'예: 새 인물, 글자, 과장된 표정, 판타지 소품'}]},
underwater:{title:'물속 장면 만들기',summary:'수중 인물·동물·사물을 위한 빛과 움직임',intro:'물속에 있는 대상을 먼저 적고, 수심과 빛을 선택하세요.',fields:[
{id:'subject',label:'물속의 주인공',kind:'text',placeholder:'예: 물속에서 천천히 헤엄치는 성인 여성'},
{id:'setting',label:'물의 장소',kind:'one',options:[['맑은 얕은 바다','햇빛과 바닥이 보임'],['깊은 바다','푸른 어둠과 긴 거리감'],['수영장','타일·수면이 있는 인공 공간'],['호수','초록빛과 흐린 가시거리']],default:0},
{id:'water',label:'물속 표현',kind:'multi',options:[['수면을 통과한 빛줄기','밝은 낮 수중에 적합'],['작고 자연스러운 기포','움직임을 암시'],['떠다니는 머리카락과 옷감','물의 저항을 표현'],['수중 원근감','먼 곳의 대비를 낮춤'],['수면의 일렁이는 그림자','얕은 물에 적합']],defaults:[0,1,2,3]},
{id:'feeling',label:'장면 분위기',kind:'one',options:[['평온하고 몽환적','느린 움직임'],['청량하고 활기차게','수영·다이빙'],['신비롭고 고요하게','깊은 물']],default:0}]},
book:{title:'동화책 장면',summary:'캐릭터와 화풍의 일관성을 가진 삽화',intro:'앞 장면이나 캐릭터 그림이 있다면 함께 첨부하고 일관성을 요청하세요.',fields:[
{id:'characters',label:'등장인물과 고정 특징',kind:'long',placeholder:'예: 분홍 털실 토끼 유니, 귀는 정확히 두 개, 파란 리본'},
{id:'story',label:'이번 장면에서 일어나는 일',kind:'long',placeholder:'예: 유니가 문 앞에서 엄마를 기다린다'},
{id:'place',label:'장소와 고정 소품',kind:'text',placeholder:'예: 나무 바닥 거실, 왼쪽 둥근 창문'},
